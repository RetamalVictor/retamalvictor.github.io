    <script>
        // Apply the saved theme before first paint so the page never flashes.
        (function () {
            var theme = 'light';
            try {
                var stored = localStorage.getItem('theme');
                if (stored === 'dark' || stored === 'light') theme = stored;
            } catch (e) { /* storage unavailable */ }
            document.documentElement.setAttribute('data-theme', theme);
        })();
    </script>

    <script>
        // GitHub Pages SPA redirect handler
        (function() {
            var redirect = sessionStorage.redirect;
            delete sessionStorage.redirect;
            if (redirect && redirect !== location.href) {
                history.replaceState(null, null, redirect);
            }

            // Handle 404 redirect with query parameter
            var query = window.location.search;
            if (query) {
                var match = query.match(/[?&]p=([^&]*)/);
                if (match) {
                    var path = decodeURIComponent(match[1]);
                    // Replace the URL without the query parameter
                    history.replaceState(null, null, path);
                }
            }
        })();
    </script>
