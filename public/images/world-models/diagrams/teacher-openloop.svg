<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 538" color="#20242B" role="img"
     aria-label="Two unrolled GRU chains. In teacher-forced training every input is a real encoded frame. In open-loop evaluation the model's own predictions feed back in as inputs after a warm-up, which are inputs it was never trained on.">
