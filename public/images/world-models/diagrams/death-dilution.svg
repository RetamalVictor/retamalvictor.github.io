<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" color="#20242B" role="img"
     aria-label="Why the death label is diluted. One random-policy episode of 63 to 75 frames ends in a single continue-equals-zero frame, about 1.5 percent of frames. Of roughly 40 valid 33-frame window starts, only the last one contains the final frame, so the label is about 0.07 percent of the BCE terms in a batch.">
  <style>
    text { fill: #20242B; }
    .lbl    { font: 13px Helvetica, Arial, sans-serif; }
    .lbl-sm { font: 11.5px Helvetica, Arial, sans-serif; fill: #6A7280; }
    .m      { font: italic 15px Georgia, 'Times New Roman', serif; }
    .mi     { font: italic 13.5px Georgia, 'Times New Roman', serif; }
    .ttl    { font: 600 13px Helvetica, Arial, sans-serif; }
    .big    { font: 600 34px Helvetica, Arial, sans-serif; }
    .sub    { font: 10px Helvetica, Arial, sans-serif; }
    .sup    { font: 9.5px Helvetica, Arial, sans-serif; }
    .up     { font-style: normal; }
  </style>
  <defs>
    <marker id="arrI" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#20242B"/></marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#8B939E"/></marker>
    <marker id="arrT" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#0F8C7C"/></marker>
    <marker id="arrA" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#C07A17"/></marker>
    <marker id="arrV" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#7B5CC4"/></marker>
    <radialGradient id="blob" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FFFFFF"/><stop offset="0.45" stop-color="#FFFFFF" stop-opacity="0.85"/><stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect x="0" y="0" width="800" height="300" rx="6" fill="#F7F8F6"/>
  <text x="110" y="42" text-anchor="start" class="lbl">one random-policy episode, 63–75 frames</text>
  <rect x="110" y="54" width="650" height="24" rx="2" fill="#FFFFFF" stroke="#20242B" stroke-width="1.3"/>
  <rect x="744" y="54" width="16" height="24" rx="2" fill="#E4DCF6" stroke="#7B5CC4" stroke-width="1.6"/>
  <text x="792" y="30" text-anchor="end" class="lbl" style="fill:#7B5CC4">continue = 0</text>
  <text x="792" y="46" text-anchor="end" class="lbl" style="fill:#7B5CC4">≈ 1.5% of frames</text>
  <rect x="110" y="104" width="305" height="24" rx="2" fill="#FFFFFF" stroke="#20242B" stroke-width="1.3"/>
  <rect x="215" y="134" width="305" height="24" rx="2" fill="#FFFFFF" stroke="#20242B" stroke-width="1.3"/>
  <rect x="320" y="164" width="305" height="24" rx="2" fill="#FFFFFF" stroke="#20242B" stroke-width="1.3"/>
  <rect x="455" y="194" width="305" height="24" rx="2" fill="#E4DCF6" stroke="#7B5CC4" stroke-width="1.6"/>
  <text x="262.5" y="121" text-anchor="middle" class="lbl-sm" style="fill:#20242B">a 33-frame training window</text>
  <text x="607.5" y="211" text-anchor="middle" class="lbl-sm" style="fill:#7B5CC4">the only start that sees the label</text>
  <text x="52" y="150" text-anchor="middle" class="lbl-sm">~40 valid</text>
  <text x="52" y="166" text-anchor="middle" class="lbl-sm">starts</text>
  <line x1="752" y1="80" x2="752" y2="191" stroke="#7B5CC4" stroke-width="1.3" stroke-dasharray="2 3"/>
  <text x="435" y="250" text-anchor="middle" class="lbl">1/40 starts × 1/33 frames ≈ 0.07% of the BCE terms in a batch</text>
  <text x="435" y="280" text-anchor="middle" class="lbl-sm">predicting “alive” everywhere already scores 0.0005 on this mixture</text>
</svg>
