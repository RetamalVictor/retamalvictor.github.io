<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 410" color="#20242B" role="img"
     aria-label="One RSSM step. A GRU core takes the previous state and action to produce h. A dashed path goes to the prior head with no frame; a solid path takes the frame through an encoder to the posterior head. A KL bracket links the two heads. The sampled z and h feed a decoder.">
  <style>
    text { fill: #20242B; }
    .lbl    { font: 13px Helvetica, Arial, sans-serif; }
    .lbl-sm { font: 11.5px Helvetica, Arial, sans-serif; fill: #6A7280; }
    .m      { font: italic 15px Georgia, 'Times New Roman', serif; }
    .mi     { font: italic 13.5px Georgia, 'Times New Roman', serif; }
    .ttl    { font: 600 13px Helvetica, Arial, sans-serif; }
    .big    { font: 600 34px Helvetica, Arial, sans-serif; }
    .sub    { font: 10px Helvetica, Arial, sans-serif; }
    .sup    { font: 9.5px Helvetica, Arial, sans-serif; }
    .up     { font-style: normal; }
  </style>
  <defs>
    <marker id="arrI" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#20242B"/></marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#8B939E"/></marker>
    <marker id="arrT" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#0F8C7C"/></marker>
    <marker id="arrA" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#C07A17"/></marker>
    <marker id="arrV" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#7B5CC4"/></marker>
    <radialGradient id="blob" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FFFFFF"/><stop offset="0.45" stop-color="#FFFFFF" stop-opacity="0.85"/><stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect x="0" y="0" width="800" height="410" rx="6" fill="#F7F8F6"/>
  <rect x="20" y="132" width="90" height="40" rx="4" fill="#F2DDB8" stroke="#C07A17" stroke-width="1.4"/>
  <text x="65" y="157" text-anchor="middle" class="m">h<tspan class="sub" dy="4">t−1</tspan><tspan dy="-4"></tspan></text>
  <rect x="20" y="192" width="90" height="40" rx="4" fill="#E4DCF6" stroke="#7B5CC4" stroke-width="1.6"/>
  <text x="65" y="217" text-anchor="middle" class="m">z<tspan class="sub" dy="4">t−1</tspan><tspan dy="-4"></tspan></text>
  <rect x="20" y="252" width="90" height="40" rx="4" fill="#E7EAEE" stroke="#8B939E" stroke-width="1.4"/>
  <text x="65" y="277" text-anchor="middle" class="m">a<tspan class="sub" dy="4">t</tspan><tspan dy="-4"></tspan></text>
  <line x1="116" y1="152" x2="146" y2="184" stroke="#20242B" stroke-width="1.4" marker-end="url(#arrI)"/>
  <line x1="116" y1="212" x2="146" y2="212" stroke="#20242B" stroke-width="1.4" marker-end="url(#arrI)"/>
  <line x1="116" y1="272" x2="146" y2="240" stroke="#20242B" stroke-width="1.4" marker-end="url(#arrI)"/>
  <rect x="152" y="142" width="100" height="140" rx="4" fill="#F2DDB8" stroke="#C07A17" stroke-width="1.4"/>
  <text x="202" y="208" text-anchor="middle" class="lbl">GRU</text>
  <text x="202" y="226" text-anchor="middle" class="lbl">core</text>
  <line x1="258" y1="212" x2="288" y2="212" stroke="#20242B" stroke-width="1.4" marker-end="url(#arrI)"/>
  <rect x="296" y="192" width="70" height="40" rx="4" fill="#F2DDB8" stroke="#C07A17" stroke-width="1.4"/>
  <text x="331" y="217" text-anchor="middle" class="m">h<tspan class="sub" dy="4">t</tspan><tspan dy="-4"></tspan></text>
  <path d="M 358 194 C 380 194, 378 96, 400 96" fill="none" stroke="#C07A17" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrA)"/>
  <rect x="406" y="68" width="180" height="56" rx="4" fill="#FBF3E6" stroke="#C07A17" stroke-width="1.4" stroke-dasharray="6 4"/>
  <text x="496" y="90" text-anchor="middle" class="lbl">prior head</text>
  <text x="496" y="112" text-anchor="middle" class="m">p(z<tspan class="sub" dy="4">t</tspan><tspan dy="-4"> | h</tspan><tspan class="sub" dy="4">t</tspan><tspan dy="-4">)</tspan></text>
  <text x="496" y="54" text-anchor="middle" class="lbl" style="fill:#C07A17">predict — the frame is withheld</text>
  <path d="M 358 230 C 380 230, 378 318, 400 318" fill="none" stroke="#C07A17" stroke-width="1.5" marker-end="url(#arrA)"/>
  <rect x="406" y="300" width="180" height="56" rx="4" fill="#BFE5DF" stroke="#0F8C7C" stroke-width="1.4"/>
  <text x="496" y="322" text-anchor="middle" class="lbl">posterior head</text>
  <text x="496" y="344" text-anchor="middle" class="m">q(z<tspan class="sub" dy="4">t</tspan><tspan dy="-4"> | h</tspan><tspan class="sub" dy="4">t</tspan><tspan dy="-4">, e</tspan><tspan class="sub" dy="4">t</tspan><tspan dy="-4">)</tspan></text>
  <text x="496" y="380" text-anchor="middle" class="lbl" style="fill:#0F8C7C">correct — the frame enters here</text>
  <rect x="196" y="336" width="52" height="52" rx="3" fill="#0B0B0D" stroke="#8B939E" stroke-width="1"/>
  <circle cx="217.8" cy="359.4" r="9.9" fill="url(#blob)"/>
  <line x1="254" y1="362" x2="282" y2="362" stroke="#20242B" stroke-width="1.4" marker-end="url(#arrI)"/>
  <rect x="290" y="342" width="82" height="40" rx="4" fill="#BFE5DF" stroke="#0F8C7C" stroke-width="1.4"/>
  <text x="331" y="367" text-anchor="middle" class="lbl">encoder</text>
  <path d="M 378 362 C 392 362, 388 342, 400 342" fill="none" stroke="#0F8C7C" stroke-width="1.5" marker-end="url(#arrT)"/>
  <text x="381" y="341" text-anchor="middle" class="mi" style="fill:#0F8C7C">e<tspan class="sub" dy="4">t</tspan><tspan dy="-4"></tspan></text>
  <line x1="566" y1="130" x2="566" y2="294" stroke="#7B5CC4" stroke-width="2" marker-end="url(#arrV)" marker-start="url(#arrV)"/>
  <text x="578" y="268" text-anchor="start" class="m" style="fill:#7B5CC4">β <tspan class="up">KL</tspan>(q || p)</text>
  <line x1="372" y1="212" x2="624" y2="212" stroke="#C07A17" stroke-width="1.5" marker-end="url(#arrA)"/>
  <line x1="592" y1="328" x2="636" y2="328" stroke="#0F8C7C" stroke-width="1.5" marker-end="url(#arrT)"/>
  <text x="677" y="367" text-anchor="middle" class="lbl-sm">sampled, always</text>
  <rect x="644" y="308" width="66" height="40" rx="4" fill="#E4DCF6" stroke="#7B5CC4" stroke-width="1.6"/>
  <text x="677" y="333" text-anchor="middle" class="m">z<tspan class="sub" dy="4">t</tspan><tspan dy="-4"></tspan></text>
  <line x1="677" y1="302" x2="677" y2="240" stroke="#7B5CC4" stroke-width="1.6" marker-end="url(#arrV)"/>
  <rect x="632" y="190" width="90" height="44" rx="4" fill="#BFE5DF" stroke="#0F8C7C" stroke-width="1.4"/>
  <text x="677" y="217" text-anchor="middle" class="lbl">decoder</text>
  <line x1="728" y1="212" x2="738" y2="212" stroke="#20242B" stroke-width="1.4" marker-end="url(#arrI)"/>
  <rect x="744" y="186" width="48" height="48" rx="3" fill="#0B0B0D" stroke="#8B939E" stroke-width="1"/>
  <circle cx="764.5" cy="208" r="9.2" fill="url(#blob)"/>
  <text x="768" y="254" text-anchor="middle" class="m">ô<tspan class="sub" dy="4">t</tspan><tspan dy="-4"></tspan></text>
</svg>
