<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 290" color="#20242B" role="img"
     aria-label="KL balancing. A thick arrow carrying 80 percent of the gradient pulls the prior toward a stop-gradiented posterior; a thin arrow carrying 20 percent regularizes the posterior toward a stop-gradiented prior. The KL value is the same either way.">
  <style>
    text { fill: #20242B; }
    .lbl    { font: 13px Helvetica, Arial, sans-serif; }
    .lbl-sm { font: 11.5px Helvetica, Arial, sans-serif; fill: #6A7280; }
    .m      { font: italic 15px Georgia, 'Times New Roman', serif; }
    .mi     { font: italic 13.5px Georgia, 'Times New Roman', serif; }
    .ttl    { font: 600 13px Helvetica, Arial, sans-serif; }
    .big    { font: 600 34px Helvetica, Arial, sans-serif; }
    .sub    { font: 10px Helvetica, Arial, sans-serif; }
    .sup    { font: 9.5px Helvetica, Arial, sans-serif; }
    .up     { font-style: normal; }
  </style>
  <defs>
    <marker id="arrI" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#20242B"/></marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#8B939E"/></marker>
    <marker id="arrT" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#0F8C7C"/></marker>
    <marker id="arrA" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#C07A17"/></marker>
    <marker id="arrV" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#7B5CC4"/></marker>
    <marker id="arrVbig" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#7B5CC4"/></marker>
    <radialGradient id="blob" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FFFFFF"/><stop offset="0.45" stop-color="#FFFFFF" stop-opacity="0.85"/><stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect x="0" y="0" width="800" height="290" rx="6" fill="#F7F8F6"/>
  <rect x="40" y="110" width="260" height="66" rx="4" fill="#F2DDB8" stroke="#C07A17" stroke-width="1.4"/>
  <text x="170" y="138" text-anchor="middle" class="lbl">prior   <tspan class="m">p</tspan>(<tspan class="m">z</tspan><tspan class="sub" dy="4">t</tspan><tspan dy="-4"> | </tspan><tspan class="m">h</tspan><tspan class="sub" dy="4">t</tspan><tspan dy="-4">)</tspan></text>
  <text x="170" y="161" text-anchor="middle" class="lbl-sm">the model's physics</text>
  <rect x="500" y="110" width="260" height="66" rx="4" fill="#BFE5DF" stroke="#0F8C7C" stroke-width="1.4"/>
  <text x="630" y="138" text-anchor="middle" class="lbl">posterior   <tspan class="m">q</tspan>(<tspan class="m">z</tspan><tspan class="sub" dy="4">t</tspan><tspan dy="-4"> | </tspan><tspan class="m">h</tspan><tspan class="sub" dy="4">t</tspan><tspan dy="-4">, </tspan><tspan class="m">o</tspan><tspan class="sub" dy="4">t</tspan><tspan dy="-4">)</tspan></text>
  <text x="630" y="161" text-anchor="middle" class="lbl-sm">perception</text>
  <path d="M 494 130 C 440 98, 360 98, 310 130" fill="none" stroke="#7B5CC4" stroke-width="3.6" stroke-linecap="round" marker-end="url(#arrVbig)"/>
  <text x="400" y="64" text-anchor="middle" class="lbl" style="fill:#7B5CC4"><tspan class="mi" style="fill:#7B5CC4">α</tspan> = 0.8 of the gradient</text>
  <text x="400" y="82" text-anchor="middle" class="lbl" style="fill:#7B5CC4">pulls the prior toward sg(<tspan class="mi" style="fill:#7B5CC4">q</tspan>)</text>
  <path d="M 306 158 C 360 190, 440 190, 492 158" fill="none" stroke="#8B939E" stroke-width="1.3" marker-end="url(#arrG)"/>
  <text x="400" y="216" text-anchor="middle" class="lbl-sm">1 − <tspan class="mi" style="fill:#6A7280">α</tspan> = 0.2 regularizes the posterior</text>
  <text x="400" y="233" text-anchor="middle" class="lbl-sm">toward sg(<tspan class="mi" style="fill:#6A7280">p</tspan>)</text>
  <text x="400" y="272" text-anchor="middle" class="lbl">same KL value either way — only the gradient is split</text>
</svg>
