<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" color="#20242B" role="img"
     aria-label="Three columns comparing the VAE, the frozen VAE plus GRU, and the joint RSSM, with their losses and velocity probe scores of 0.00, 0.81 and 0.96. The gradient from the prediction loss reaches the encoder only in the joint RSSM.">
  <style>
    text { fill: #20242B; }
    .lbl    { font: 13px Helvetica, Arial, sans-serif; }
    .lbl-sm { font: 11.5px Helvetica, Arial, sans-serif; fill: #6A7280; }
    .m      { font: italic 15px Georgia, 'Times New Roman', serif; }
    .mi     { font: italic 13.5px Georgia, 'Times New Roman', serif; }
    .ttl    { font: 600 13px Helvetica, Arial, sans-serif; }
    .big    { font: 600 34px Helvetica, Arial, sans-serif; }
    .sub    { font: 10px Helvetica, Arial, sans-serif; }
    .sup    { font: 9.5px Helvetica, Arial, sans-serif; }
    .up     { font-style: normal; }
  </style>
  <defs>
    <marker id="arrI" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#20242B"/></marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#8B939E"/></marker>
    <marker id="arrT" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#0F8C7C"/></marker>
    <marker id="arrA" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#C07A17"/></marker>
    <marker id="arrV" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#7B5CC4"/></marker>
    <radialGradient id="blob" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FFFFFF"/><stop offset="0.45" stop-color="#FFFFFF" stop-opacity="0.85"/><stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect x="0" y="0" width="800" height="500" rx="6" fill="#F7F8F6"/>
  <text x="18" y="34" text-anchor="start" class="lbl-sm">the gradient from the prediction loss reaches the encoder only in the third column</text>
  <rect x="18.0" y="58" width="236" height="420" rx="6" fill="#FFFFFF" stroke="#D8DCE2" stroke-width="1"/>
  <rect x="282.0" y="58" width="236" height="420" rx="6" fill="#FFFFFF" stroke="#D8DCE2" stroke-width="1"/>
  <rect x="546.0" y="58" width="236" height="420" rx="6" fill="#FFFFFF" stroke="#D8DCE2" stroke-width="1"/>
  <text x="136" y="84" text-anchor="middle" class="ttl">(a) VAE</text>
  <text x="136" y="104" text-anchor="middle" class="lbl-sm">single frame in, same frame out</text>
  <rect x="63.0" y="130" width="146" height="44" rx="4" fill="#BFE5DF" stroke="#0F8C7C" stroke-width="1.4"/>
  <text x="136" y="158" text-anchor="middle" class="lbl">encoder</text>
  <line x1="136" y1="176" x2="136" y2="199" stroke="#8B939E" stroke-width="1.3" marker-end="url(#arrG)"/>
  <rect x="63.0" y="202" width="146" height="44" rx="4" fill="#E4DCF6" stroke="#7B5CC4" stroke-width="1.6"/>
  <text x="136" y="231" text-anchor="middle" class="lbl"><tspan class="m">z</tspan></text>
  <line x1="136" y1="248" x2="136" y2="271" stroke="#8B939E" stroke-width="1.3" marker-end="url(#arrG)"/>
  <rect x="63.0" y="274" width="146" height="44" rx="4" fill="#BFE5DF" stroke="#0F8C7C" stroke-width="1.4"/>
  <text x="136" y="302" text-anchor="middle" class="lbl">decoder</text>
  <text x="136" y="352" text-anchor="middle" class="lbl">recon + <tspan class="m">β</tspan>KL(<tspan class="m">q</tspan> || N(0, <tspan class="m">I</tspan>))</text>
  <text x="400" y="84" text-anchor="middle" class="ttl">(b) frozen VAE + GRU</text>
  <text x="400" y="104" text-anchor="middle" class="lbl-sm">latents in, next latent out</text>
  <rect x="327.0" y="130" width="146" height="44" rx="4" fill="#E7EAEE" stroke="#8B939E" stroke-width="1.4" stroke-dasharray="6 4"/>
  <text x="400" y="158" text-anchor="middle" class="lbl">encoder (frozen)</text>
  <line x1="400" y1="176" x2="400" y2="199" stroke="#8B939E" stroke-width="1.3" marker-end="url(#arrG)"/>
  <rect x="327.0" y="202" width="146" height="44" rx="4" fill="#E4DCF6" stroke="#7B5CC4" stroke-width="1.6"/>
  <text x="400" y="231" text-anchor="middle" class="lbl"><tspan class="m">z</tspan> sequence</text>
  <line x1="400" y1="248" x2="400" y2="271" stroke="#8B939E" stroke-width="1.3" marker-end="url(#arrG)"/>
  <rect x="327.0" y="274" width="146" height="44" rx="4" fill="#F2DDB8" stroke="#C07A17" stroke-width="1.4"/>
  <text x="400" y="303" text-anchor="middle" class="lbl">GRU → <tspan class="m">μ</tspan><tspan class="sub" dy="4">t</tspan><tspan dy="-4">, </tspan><tspan class="m">σ</tspan><tspan class="sub" dy="4">t</tspan></text>
  <text x="400" y="352" text-anchor="middle" class="lbl">−log N(<tspan class="m">z</tspan><tspan class="sub" dy="4">t</tspan><tspan dy="-4"> | </tspan><tspan class="m">μ</tspan><tspan class="sub" dy="4">t</tspan><tspan dy="-4">, </tspan><tspan class="m">σ</tspan><tspan class="sub" dy="4">t</tspan><tspan dy="-4">)</tspan></text>
  <path d="M 485.0 342 V 152.0 H 478.0" fill="none" stroke="#8B939E" stroke-width="1.3" stroke-dasharray="4 3" marker-end="url(#arrG)"/>
  <line x1="478.0" y1="197" x2="492.0" y2="211" stroke="#8B939E" stroke-width="2.2"/>
  <line x1="492.0" y1="197" x2="478.0" y2="211" stroke="#8B939E" stroke-width="2.2"/>
  <text x="664" y="84" text-anchor="middle" class="ttl">(c) joint RSSM</text>
  <text x="664" y="104" text-anchor="middle" class="lbl-sm">pixels in, next pixels out</text>
  <rect x="591.0" y="130" width="146" height="44" rx="4" fill="#BFE5DF" stroke="#0F8C7C" stroke-width="1.4"/>
  <text x="664" y="158" text-anchor="middle" class="lbl">encoder</text>
  <line x1="664" y1="176" x2="664" y2="199" stroke="#8B939E" stroke-width="1.3" marker-end="url(#arrG)"/>
  <rect x="591.0" y="202" width="146" height="44" rx="4" fill="#E4DCF6" stroke="#7B5CC4" stroke-width="1.6"/>
  <text x="664" y="231" text-anchor="middle" class="lbl"><tspan class="m">h</tspan><tspan class="sub" dy="4">t</tspan><tspan dy="-4">, </tspan><tspan class="m">z</tspan><tspan class="sub" dy="4">t</tspan></text>
  <line x1="664" y1="248" x2="664" y2="271" stroke="#8B939E" stroke-width="1.3" marker-end="url(#arrG)"/>
  <rect x="591.0" y="274" width="146" height="44" rx="4" fill="#BFE5DF" stroke="#0F8C7C" stroke-width="1.4"/>
  <text x="664" y="302" text-anchor="middle" class="lbl">decoder</text>
  <text x="664" y="352" text-anchor="middle" class="lbl">recon + <tspan class="m">β</tspan>KL(<tspan class="m">q</tspan> || <tspan class="m">p</tspan>)</text>
  <path d="M 749.0 342 V 152.0 H 742.0" fill="none" stroke="#7B5CC4" stroke-width="1.6" stroke-dasharray="4 3" marker-end="url(#arrV)"/>
  <text x="753.0" y="228.0" text-anchor="start" class="lbl-sm" style="fill:#7B5CC4; font-size:10.5px">grad</text>
  <line x1="256.0" y1="224.0" x2="279.0" y2="224.0" stroke="#8B939E" stroke-width="1.3" marker-end="url(#arrG)"/>
  <line x1="520.0" y1="224.0" x2="543.0" y2="224.0" stroke="#8B939E" stroke-width="1.3" marker-end="url(#arrG)"/>
  <line x1="41" y1="378" x2="231" y2="378" stroke="#D8DCE2" stroke-width="1.2"/>
  <text x="136" y="406" text-anchor="middle" class="lbl-sm">velocity probe <tspan class="mi" style="fill:#6A7280">R</tspan><tspan class="sup" dy="-5">2</tspan></text>
  <line x1="305" y1="378" x2="495" y2="378" stroke="#D8DCE2" stroke-width="1.2"/>
  <text x="400" y="406" text-anchor="middle" class="lbl-sm">velocity probe <tspan class="mi" style="fill:#6A7280">R</tspan><tspan class="sup" dy="-5">2</tspan></text>
  <line x1="569" y1="378" x2="759" y2="378" stroke="#D8DCE2" stroke-width="1.2"/>
  <text x="664" y="406" text-anchor="middle" class="lbl-sm">velocity probe <tspan class="mi" style="fill:#6A7280">R</tspan><tspan class="sup" dy="-5">2</tspan></text>
  <text x="136" y="456" text-anchor="middle" class="big" style="fill:#8B939E">0.00</text>
  <text x="400" y="456" text-anchor="middle" class="big" style="fill:#20242B">0.81</text>
  <text x="664" y="456" text-anchor="middle" class="big" style="fill:#7B5CC4">0.96</text>
</svg>
