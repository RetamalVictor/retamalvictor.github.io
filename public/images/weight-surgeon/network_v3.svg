<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="400" viewBox="0 0 1180 400" color="#20242B" role="img" aria-label="RAPTOR's policy: 22 inputs (position error, rotation matrix, velocity error, body rates, previous output) through a dense ReLU layer, a 16-unit GRU and a dense output layer to four motor commands.">
<style>
