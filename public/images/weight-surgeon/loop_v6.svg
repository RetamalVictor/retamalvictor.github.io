<text x="126.0" y="162" text-anchor="middle" class="cap-sm">original RAPTOR</text>
<text x="126.0" y="182" text-anchor="middle" class="cap-sm">weights, numpy l2f</text>
<rect x="258.0" y="96" width="200" height="110" rx="14" fill="#FFFFFF" stroke="#20242B" stroke-width="1.3"/>
