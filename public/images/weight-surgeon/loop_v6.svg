<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="270" viewBox="0 0 1180 270" color="#20242B" role="img" aria-label="The repair loop: fly the original RAPTOR weights and record an episode; write the brief; Claude forms a hypothesis, edits and flies through the harness; submits; the verdict is computed on new starts across every vehicle and scenario.">
<style>
text { fill: #20242B; }
.name { font: 700 22px Helvetica, Arial, sans-serif; letter-spacing: -0.3px; }
.name-sm { font: 700 18px Helvetica, Arial, sans-serif; }
.cap { font: 18px Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; fill: #363B43; }
.cap-sm { font: 16.5px Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; fill: #363B43; }
.lbl-sm { font: 15px Helvetica, Arial, sans-serif; fill: #363B43; }
.bl { fill: #0B57D0; }
</style>
