<text x="590.0" y="162" text-anchor="middle" class="cap-sm">hypothesis,</text>
<text x="590.0" y="182" text-anchor="middle" class="cap-sm">edit and fly</text>
<rect x="722.0" y="96" width="200" height="110" rx="14" fill="#FFFFFF" stroke="#0B57D0" stroke-width="1.3"/>
<text x="822.0" y="134" text-anchor="middle" class="name">submit</text>
<text x="822.0" y="162" text-anchor="middle" class="cap-sm">the edit,</text>
<text x="822.0" y="182" text-anchor="middle" class="cap-sm">and why</text>
